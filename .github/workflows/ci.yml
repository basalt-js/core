name: CI

# Thin caller. All logic lives in basalt-js/ci. Switch @main to a release tag (@v0) once
# basalt-js/ci publishes its first version.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: basalt-js/ci/.github/workflows/package-ci.yml@main
    with:
      typescript-versions: '["6.0", "7.0"]'
      test-script: test:coverage
